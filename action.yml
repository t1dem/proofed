name: Proofed
description: Runs the scenarios a PR touches in real Chrome with Kane CLI, records each run, reports on the PR, and has Claude fix what broke when asked.
branding:
  icon: eye
  color: orange

# Two ways to use it. With install/build/serve (what the Proofed setup PR writes), this action is the
# whole workflow: it checks out the PR, serves the app, and either checks it or runs the fixer,
# depending on the event. Without them it only runs the check, against an app the workflow already
# serves; the fixer is then t1dem/proofed/fix in a second workflow.
inputs:
  url:
    description: Where the app under test runs, e.g. http://localhost:4173
    required: true
  install:
    description: Command that installs dependencies
    default: ""
  build:
    description: Command that builds the app (also after every fix attempt)
    default: ""
  serve:
    description: Command that serves the built app on `url`. Setting it makes this action do the whole job.
    default: ""
  working-directory:
    description: Folder the app lives in, when it isn't the repo root (e.g. site). install, build and serve run there.
    default: "."
  cache:
    description: Package manager whose cache setup-node keeps (npm, pnpm, yarn), or empty
    default: ""
  lt-username:
    description: TestMu username (secrets.LT_USERNAME)
    required: true
  lt-access-key:
    description: TestMu access key (secrets.LT_ACCESS_KEY)
    required: true
  claude-code-oauth-token:
    description: From `claude setup-token` (secrets.CLAUDE_CODE_OAUTH_TOKEN), for the fixer
    default: ""
  vars:
    description: The repo's Actions variables as JSON (pass toJSON(vars) in an expression). Carries settings from the Proofed dashboard, such as PROOFED_MODEL.
    default: "{}"
  scenarios:
    description: Folder with scenario Markdown files
    default: .proofed/scenarios
  only:
    description: Comma-separated scenario ids to run instead of picking them from the diff
    default: ""
  fix:
    description: Offer "Fix with Claude" on failures
    default: "true"
  github-token:
    description: Token for the PR comment, commit status, the clips branch and the fixer's push
    default: ${{ github.token }}
  proofed-url:
    description: "Proofed's server. With `id-token: write` in the workflow, the fixer gets a token of the Proofed GitHub App there and pushes with it, so the workflows on the fix commit run without an approval."
    default: https://proofed.neptunescodm.workers.dev
  kane-version:
    description: "@testmuai/kane-cli version"
    default: "0.10.4"

outputs:
  report:
    description: Path to the Markdown report
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Decide what to run
      id: mode
      if: inputs.serve != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_FIX: ${{ inputs.fix }}
        PROOFED_VARS: ${{ inputs.vars }}
      run: node "$GITHUB_ACTION_PATH/src/mode.ts"

    # The fixer pushes to the PR's branch, so it needs the branch; the check needs the exact commit.
    - uses: actions/checkout@v4
      if: steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix'
      with:
        ref: ${{ steps.mode.outputs.mode == 'fix' && steps.mode.outputs.head_ref || steps.mode.outputs.head_sha }}
        fetch-depth: 0
        token: ${{ inputs.github-token }}

    - uses: actions/setup-node@v4
      if: inputs.cache != '' && (steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix')
      with:
        node-version: 24
        cache: ${{ inputs.cache }}

    # apt-get install ffmpeg took 35-65 s of every run. A static build (ffmpeg 7.0.2 with libx264, from
    # eugeneware/ffmpeg-static) is one 25-30 MB download, checked against its SHA-256 and kept in the cache.
    # Other runners, or a failed download, get apt-get as before.
    - name: Pick an ffmpeg build
      id: ffmpeg
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) echo "arch=x64" >> "$GITHUB_OUTPUT" ;;
          Linux-ARM64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
        esac
        echo "dir=${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/proofed-ffmpeg" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v4
      if: steps.ffmpeg.outputs.arch != ''
      with:
        path: ${{ steps.ffmpeg.outputs.dir }}
        key: proofed-ffmpeg-b6.1.1-${{ steps.ffmpeg.outputs.arch }}

    - name: Install Kane CLI and ffmpeg
      id: tools
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      env:
        FFMPEG_ARCH: ${{ steps.ffmpeg.outputs.arch }}
        FFMPEG_DIR: ${{ steps.ffmpeg.outputs.dir }}
      run: |
        npm install -g "@testmuai/kane-cli@${{ inputs.kane-version }}" >/dev/null
        if [ "${{ steps.mode.outputs.mode }}" = fix ]; then npm install -g @anthropic-ai/claude-code >/dev/null; fi
        if [ -n "$FFMPEG_ARCH" ] && [ ! -x "$FFMPEG_DIR/ffmpeg" ]; then
          case "$FFMPEG_ARCH" in
            x64) sum=bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa ;;
            arm64) sum=754a678672298bc68156adff58aa7385a592c2b30b1d0ae8750c45c915c4bac0 ;;
          esac
          mkdir -p "$FFMPEG_DIR"
          if curl -fsSL --retry 2 -o "$FFMPEG_DIR/ffmpeg.gz" "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-$FFMPEG_ARCH.gz" &&
            echo "$sum  $FFMPEG_DIR/ffmpeg.gz" | sha256sum -c --quiet - &&
            gunzip -f "$FFMPEG_DIR/ffmpeg.gz" && chmod +x "$FFMPEG_DIR/ffmpeg" && "$FFMPEG_DIR/ffmpeg" -version >/dev/null; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "Couldn't get the static ffmpeg; installing it with apt-get"
            rm -rf "$FFMPEG_DIR"
          fi
        fi
        if [ -n "$FFMPEG_ARCH" ] && "$FFMPEG_DIR/ffmpeg" -version >/dev/null 2>&1; then
          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          "$FFMPEG_DIR/ffmpeg" -version | sed -n 1p
        else
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
        fi
        kane-cli --version

    # Saved right away: the cache action's own post step skips saving when the job fails, and a red run is common here.
    - uses: actions/cache/save@v4
      if: steps.tools.outputs.fetched == 'true'
      with:
        path: ${{ steps.ffmpeg.outputs.dir }}
        key: proofed-ffmpeg-b6.1.1-${{ steps.ffmpeg.outputs.arch }}

    # Each stage leaves its name and output behind, so a failure before Kane can be reported on the PR.
    - name: Install the app's dependencies
      id: deps
      if: steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROOFED_INSTALL: ${{ inputs.install }}
      run: |
        echo install > "$RUNNER_TEMP/proofed-stage"
        bash -e -o pipefail -c "$PROOFED_INSTALL" 2>&1 | tee "$RUNNER_TEMP/proofed-app.log"

    - name: Build and serve the app
      id: app
      if: steps.mode.outputs.mode == 'check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_URL: ${{ inputs.url }}
      run: |
        echo build > "$RUNNER_TEMP/proofed-stage"
        bash -e -o pipefail -c "$PROOFED_BUILD" 2>&1 | tee "$RUNNER_TEMP/proofed-app.log"
        echo serve > "$RUNNER_TEMP/proofed-stage"
        (bash -c "$PROOFED_SERVE" > "$RUNNER_TEMP/proofed-app.log" 2>&1 &)
        npx --yes wait-on@8 -t 60000 "$PROOFED_URL"

    # Without this the PR gets a red cross and no word on why: Kane never ran, so no report was written.
    - name: Say on the PR that the app didn't start
      if: failure() && steps.mode.outputs.mode == 'check' && (steps.deps.outcome == 'failure' || steps.app.outcome == 'failure')
      shell: bash
      env:
        PROOFED_INSTALL: ${{ inputs.install }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_NUMBER: ${{ steps.mode.outputs.number }}
        PROOFED_SHA: ${{ steps.mode.outputs.head_sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/blocked.ts"

    - name: Log Kane in
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      env:
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
      # Logging in once sets up the TestMu project and folder before the parallel runs start;
      # otherwise the first runs race to create them and fail.
      run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" </dev/null

    - name: Run scenarios with Kane
      id: run
      if: steps.mode.outputs.mode != 'none' && steps.mode.outputs.mode != 'fix'
      shell: bash
      env:
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_ONLY: ${{ inputs.only }}
        PROOFED_FIX: ${{ inputs.fix }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Same cold-Chrome defaults TestMu's own action uses on runners.
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
      run: |
        echo "report=$PROOFED_OUT/report.md" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/src/cli.ts"

    - name: Fix with Claude, verify with Kane
      if: steps.mode.outputs.mode == 'fix'
      shell: bash
      env:
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_BASE_SHA: ${{ steps.mode.outputs.base_sha }}
        PROOFED_HEAD_REF: ${{ steps.mode.outputs.head_ref }}
        PROOFED_BASE_REF: ${{ steps.mode.outputs.base_ref }}
        PROOFED_CLAUDE_MODEL: ${{ steps.mode.outputs.model }}
        PROOFED_CLAUDE_EFFORT: ${{ steps.mode.outputs.effort }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_SERVER: ${{ inputs.proofed-url }}
      run: node "$GITHUB_ACTION_PATH/src/fix.ts"

    - name: Keep the recordings
      if: always() && steps.mode.outputs.mode != 'none'
      uses: actions/upload-artifact@v4
      with:
        name: proofed-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/proofed/**/clip.mp4
          ${{ runner.temp }}/proofed/**/crash-*.jpg
          ${{ runner.temp }}/proofed/*.json
          ${{ runner.temp }}/proofed/*.md
        if-no-files-found: ignore
