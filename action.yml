name: Proofed
description: Runs the scenarios a PR touches with Kane CLI, records local runs, reports on the PR, and has the selected agent fix what broke when asked.
branding:
  icon: eye
  color: orange

# With build, serve or target, this action checks out the PR and chooses check or fix from the event.
# It serves web apps and prepares native/desktop targets. Without those inputs it only checks
# an app the workflow already serves; use t1dem/proofed/fix in a second workflow for fixes.
inputs:
  url:
    description: Required for web scenarios, e.g. http://localhost:4173
    required: false
  target:
    description: web, ios, android or experimental desktop
    default: ""
  execution:
    description: local, or cloud for ios/android (requires a TestMu real-device automation plan)
    default: ""
  app:
    description: Mobile artifact path or Kane APP ID, or desktop executable; fixing needs a rebuildable path
    default: ""
  device:
    description: Exact device name
    default: ""
  os-version:
    description: Device OS version
    default: ""
  launch:
    description: Owned desktop launch command with remote debugging
    default: ""
  cdp-endpoint:
    description: Desktop browser CDP endpoint
    default: ""
  install:
    description: Command that installs dependencies once per check/fix job
    default: ""
  build:
    description: Command that builds the app (also after every fix attempt)
    default: ""
  serve:
    description: Command that serves the built web app on `url`. Only needed for web scenarios.
    default: ""
  working-directory:
    description: Folder the app lives in, when it isn't the repo root (e.g. site). install, build and serve run there.
    default: "."
  cache:
    description: Package manager whose cache setup-node keeps (npm, pnpm, yarn), or empty
    default: ""
  lt-username:
    description: TestMu username (secrets.LT_USERNAME)
    required: true
  lt-access-key:
    description: TestMu access key (secrets.LT_ACCESS_KEY)
    required: true
  claude-code-oauth-token:
    description: From `claude setup-token` (secrets.CLAUDE_CODE_OAUTH_TOKEN), for the fixer and for writing scenarios on the setup PR
    default: ""
  codex-api-key:
    description: OpenAI API key for Codex (secrets.CODEX_API_KEY)
    default: ""
  codex-auth-json:
    description: Contents of ~/.codex/auth.json after `codex login` with a ChatGPT plan (secrets.CODEX_AUTH_JSON), used when codex-api-key is empty
    default: ""
  vars:
    description: The repo's Actions variables as JSON (pass toJSON(vars) in an expression). Carries settings from the Proofed dashboard, such as PROOFED_MODEL.
    default: "{}"
  scenarios:
    description: Folder with scenario Markdown files
    default: .proofed/scenarios
  only:
    description: Comma-separated scenario ids to run instead of picking them from the diff
    default: ""
  fix:
    description: Offer the selected fixer on failures
    default: "true"
  github-token:
    description: Token for the PR comment, commit status, the clips branch and the fixer's push
    default: ${{ github.token }}
  proofed-url:
    description: "Proofed's server. With `id-token: write` in the workflow, the dashboard there follows each run as it goes, and the fixer gets a token of the Proofed GitHub App there and pushes with it, so the workflows on the fix commit run without an approval."
    default: https://proofed.neptunescodm.workers.dev
  kane-version:
    description: "@testmuai/kane-cli version"
    default: "0.10.4"

outputs:
  report:
    description: Path to the Markdown report
    value: ${{ steps.run.outputs.report || steps.generate.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Decide what to run
      id: mode
      if: inputs.serve != '' || inputs.build != '' || inputs.target != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_FIX: ${{ inputs.fix }}
        PROOFED_VARS: ${{ inputs.vars }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        # Whether there is a provider credential, not the token: this step needs no more.
        PROOFED_CLAUDE: ${{ inputs.claude-code-oauth-token != '' }}
        PROOFED_CODEX: ${{ inputs.codex-api-key != '' || inputs.codex-auth-json != '' }}
      run: node "$GITHUB_ACTION_PATH/src/mode.ts"

    # The fixer pushes to the PR's branch, so it needs the branch; the check needs the exact commit.
    - uses: actions/checkout@v4
      if: steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix'
      with:
        ref: ${{ steps.mode.outputs.mode == 'fix' && steps.mode.outputs.head_ref || steps.mode.outputs.head_sha }}
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        # The agent can read the checkout. src/push.ts passes the token to git push itself.
        persist-credentials: false

    - name: Resolve scenario targets
      id: targets
      if: steps.mode.outputs.mode == 'check'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_ONLY: ${{ inputs.only }}
        PROOFED_SHA: ${{ steps.mode.outputs.head_sha }}
        PROOFED_BASE_SHA: ${{ steps.mode.outputs.base_sha }}
      run: node "$GITHUB_ACTION_PATH/src/actiontarget.ts"

    - uses: actions/setup-node@v4
      if: inputs.cache != '' && (steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix')
      with:
        node-version: 24
        cache: ${{ inputs.cache }}

    # apt-get install ffmpeg took 35-65 s of every run. A static build (ffmpeg 7.0.2 with libx264, from
    # eugeneware/ffmpeg-static) is one 25-30 MB download, checked against its SHA-256 and kept in the cache.
    # Other runners use their system package manager; failed Linux downloads fall back to apt-get.
    - name: Pick an ffmpeg build
      id: ffmpeg
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) echo "arch=x64" >> "$GITHUB_OUTPUT" ;;
          Linux-ARM64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
        esac
        echo "dir=${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/proofed-ffmpeg" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v4
      if: steps.ffmpeg.outputs.arch != ''
      with:
        path: ${{ steps.ffmpeg.outputs.dir }}
        key: proofed-ffmpeg-b6.1.1-${{ steps.ffmpeg.outputs.arch }}

    - name: Install Kane CLI and ffmpeg
      id: tools
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      env:
        FFMPEG_ARCH: ${{ steps.ffmpeg.outputs.arch }}
        FFMPEG_DIR: ${{ steps.ffmpeg.outputs.dir }}
      run: |
        npm install -g "@testmuai/kane-cli@${{ inputs.kane-version }}" >/dev/null
        if [ "${{ steps.mode.outputs.mode }}" = fix ] || [ "${{ steps.mode.outputs.generate }}" = true ]; then
          if [ "${{ steps.mode.outputs.provider }}" = codex ]; then npm install -g @openai/codex@0.169.0 >/dev/null; else npm install -g @anthropic-ai/claude-code >/dev/null; fi
        fi
        if [ -n "$FFMPEG_ARCH" ] && [ ! -x "$FFMPEG_DIR/ffmpeg" ]; then
          case "$FFMPEG_ARCH" in
            x64) sum=bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa ;;
            arm64) sum=754a678672298bc68156adff58aa7385a592c2b30b1d0ae8750c45c915c4bac0 ;;
          esac
          mkdir -p "$FFMPEG_DIR"
          if curl -fsSL --retry 2 -o "$FFMPEG_DIR/ffmpeg.gz" "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-$FFMPEG_ARCH.gz" &&
            echo "$sum  $FFMPEG_DIR/ffmpeg.gz" | sha256sum -c --quiet - &&
            gunzip -f "$FFMPEG_DIR/ffmpeg.gz" && chmod +x "$FFMPEG_DIR/ffmpeg" && "$FFMPEG_DIR/ffmpeg" -version >/dev/null; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "Couldn't get the static ffmpeg; installing it with apt-get"
            rm -rf "$FFMPEG_DIR"
          fi
        fi
        if [ -n "$FFMPEG_ARCH" ] && "$FFMPEG_DIR/ffmpeg" -version >/dev/null 2>&1; then
          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          "$FFMPEG_DIR/ffmpeg" -version | sed -n 1p
        else
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install ffmpeg ;;
              Windows) choco install ffmpeg -y --no-progress ;;
              *) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null ;;
            esac
          fi
        fi
        kane-cli --version

    # Saved right away: the cache action's own post step skips saving when the job fails, and a red run is common here.
    - uses: actions/cache/save@v4
      if: steps.tools.outputs.fetched == 'true'
      with:
        path: ${{ steps.ffmpeg.outputs.dir }}
        key: proofed-ffmpeg-b6.1.1-${{ steps.ffmpeg.outputs.arch }}

    # Each stage leaves its name and output behind, so a failure before Kane can be reported on the PR.
    - name: Install the app's dependencies
      id: deps
      if: steps.mode.outputs.mode == 'check' || steps.mode.outputs.mode == 'fix'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROOFED_INSTALL: ${{ inputs.install }}
      run: |
        echo install > "$RUNNER_TEMP/proofed-stage"
        bash -e -o pipefail -c "$PROOFED_INSTALL" 2>&1 | tee "$RUNNER_TEMP/proofed-app.log"

    - name: Build and serve the app
      id: app
      if: steps.mode.outputs.mode == 'check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
      run: |
        echo build > "$RUNNER_TEMP/proofed-stage"
        bash -e -o pipefail -c "$PROOFED_BUILD" 2>&1 | tee "$RUNNER_TEMP/proofed-app.log"
        echo serve > "$RUNNER_TEMP/proofed-stage"
        if [ "${{ steps.targets.outputs.web }}" = true ] && [ -n "$PROOFED_SERVE" ]; then
          (bash -c "$PROOFED_SERVE" > "$RUNNER_TEMP/proofed-app.log" 2>&1 &)
          npx --yes wait-on@8 -t 60000 "$PROOFED_URL"
        fi

    # Without this the PR gets a red cross and no word on why: Kane never ran, so no report was written.
    - name: Say on the PR that the app didn't start
      if: failure() && steps.mode.outputs.mode == 'check' && (steps.deps.outcome == 'failure' || steps.app.outcome == 'failure')
      shell: bash
      env:
        PROOFED_INSTALL: ${{ inputs.install }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_NUMBER: ${{ steps.mode.outputs.number }}
        PROOFED_SHA: ${{ steps.mode.outputs.head_sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
      run: node "$GITHUB_ACTION_PATH/src/blocked.ts"

    - name: Log Kane in
      if: steps.mode.outputs.mode != 'none'
      shell: bash
      env:
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
      # Logging in once sets up the TestMu project and folder before the parallel runs start;
      # otherwise the first runs race to create them and fail.
      run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" </dev/null

    - name: Run scenarios with Kane
      id: run
      if: steps.mode.outputs.mode != 'none' && steps.mode.outputs.mode != 'fix' && steps.mode.outputs.generate != 'true'
      shell: bash
      env:
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_ONLY: ${{ inputs.only }}
        PROOFED_FIX: ${{ inputs.fix }}
        # Only the head is pinned: the base stays origin/<base branch> (pipeline.ts baseRev), current even for an old PR.
        PROOFED_SHA: ${{ steps.mode.outputs.head_sha }}
        PROOFED_PROVIDER: ${{ steps.mode.outputs.provider }}
        PROOFED_MODEL: ${{ steps.mode.outputs.model }}
        PROOFED_EFFORT: ${{ steps.mode.outputs.effort }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_SERVER: ${{ inputs.proofed-url }}
        # Whether each provider has a credential, so the report offers only a fix this workflow can start.
        PROOFED_CLAUDE: ${{ inputs.claude-code-oauth-token != '' }}
        PROOFED_CODEX: ${{ inputs.codex-api-key != '' || inputs.codex-auth-json != '' }}
        # Same cold-Chrome defaults TestMu's own action uses on runners.
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
      run: |
        echo "report=$PROOFED_OUT/report.md" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/src/cli.ts"

    - name: Prepare Codex subscription credentials
      id: codex-auth
      if: >-
        !cancelled() && steps.mode.outputs.provider == 'codex' &&
        inputs.codex-api-key == '' && inputs.codex-auth-json != '' &&
        ((success() && (steps.mode.outputs.mode == 'fix' || steps.mode.outputs.generate == 'true')) ||
        (steps.mode.outputs.autofix == 'true' && steps.run.outputs.fixable == 'true'))
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
      run: |
        dir=$(mktemp -d "$RUNNER_TEMP/proofed-codex-auth.XXXXXX")
        trap 'rm -rf -- "$dir"' EXIT
        chmod 700 "$dir"
        umask 077
        printf '%s' "$CODEX_AUTH_JSON" > "$dir/auth.json"
        chmod 600 "$dir/auth.json"
        printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"
        trap - EXIT

    # "Fix automatically" in the dashboard: a check that saw a scenario fail goes on to fix it in this job,
    # as a ticked "Fix with Claude" would (src/mode.ts decides when). The check's app server is stopped
    # first, so Kane re-checks the fixer's own build rather than the old one still on the port.
    - name: Fix automatically
      if: ${{ !cancelled() && steps.mode.outputs.autofix == 'true' && steps.run.outputs.fixable == 'true' && steps.codex-auth.outcome != 'failure' }}
      shell: bash
      env:
        PROOFED_AUTO: "true"
        PROOFED_NUMBER: ${{ steps.mode.outputs.number }}
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_BASE_SHA: ${{ steps.mode.outputs.base_sha }}
        PROOFED_HEAD_REF: ${{ steps.mode.outputs.head_ref }}
        PROOFED_BASE_REF: ${{ steps.mode.outputs.base_ref }}
        PROOFED_PROVIDER: ${{ steps.mode.outputs.provider }}
        PROOFED_MODEL: ${{ steps.mode.outputs.model }}
        PROOFED_EFFORT: ${{ steps.mode.outputs.effort }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
        PROOFED_CODEX_HOME: ${{ steps.codex-auth.outputs.dir }}
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_SERVER: ${{ inputs.proofed-url }}
      run: |
        if [ -n "$PROOFED_URL" ]; then
          port=$(node -e 'const u = new URL(process.argv[1]); console.log(u.port || (u.protocol === "https:" ? 443 : 80))' "$PROOFED_URL")
          if [ "$RUNNER_OS" = Windows ]; then
            PROOFED_PORT="$port" powershell.exe -NoProfile -NonInteractive -Command \
              'Get-NetTCPConnection -LocalPort ([int]$env:PROOFED_PORT) -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { & taskkill.exe /PID $_ /T /F }' >/dev/null 2>&1 || true
          else
            (fuser -k "$port/tcp" || lsof -ti "tcp:$port" | while IFS= read -r pid; do kill "$pid"; done) >/dev/null 2>&1 || true
          fi
          for i in $(seq 1 20); do curl -s -o /dev/null "$PROOFED_URL" || break; sleep 0.5; done
        fi
        if [ "$PROOFED_PROVIDER" = codex ]; then npm install -g @openai/codex@0.169.0 >/dev/null; else npm install -g @anthropic-ai/claude-code >/dev/null; fi
        if [ -n "$PROOFED_CODEX_HOME" ]; then
          export CODEX_HOME="$PROOFED_CODEX_HOME"
          unset CODEX_API_KEY
        fi
        node "$GITHUB_ACTION_PATH/src/fix.ts"

    # The setup PR's check, while it holds only the stock scenario (src/mode.ts): the selected agent writes the first
    # scenarios, Kane runs them with the stock one, and the ones that pass are pushed to the setup branch.
    - name: Write scenarios, run them with Kane
      id: generate
      if: steps.mode.outputs.mode == 'check' && steps.mode.outputs.generate == 'true'
      shell: bash
      env:
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_HEAD_REF: ${{ steps.mode.outputs.head_ref }}
        PROOFED_PROVIDER: ${{ steps.mode.outputs.provider }}
        PROOFED_MODEL: ${{ steps.mode.outputs.model }}
        PROOFED_EFFORT: ${{ steps.mode.outputs.effort }}
        PROOFED_FIX: ${{ inputs.fix }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
        PROOFED_CODEX_HOME: ${{ steps.codex-auth.outputs.dir }}
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_SERVER: ${{ inputs.proofed-url }}
      run: |
        echo "report=$PROOFED_OUT/report.md" >> "$GITHUB_OUTPUT"
        if [ -n "$PROOFED_CODEX_HOME" ]; then
          export CODEX_HOME="$PROOFED_CODEX_HOME"
          unset CODEX_API_KEY
        fi
        node "$GITHUB_ACTION_PATH/src/generate.ts"

    - name: Fix, verify with Kane
      if: steps.mode.outputs.mode == 'fix'
      shell: bash
      env:
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_TARGET: ${{ inputs.target }}
        PROOFED_EXECUTION: ${{ inputs.execution }}
        PROOFED_APP: ${{ inputs.app }}
        PROOFED_DEVICE: ${{ inputs.device }}
        PROOFED_OS_VERSION: ${{ inputs.os-version }}
        PROOFED_LAUNCH: ${{ inputs.launch }}
        PROOFED_CDP_ENDPOINT: ${{ inputs.cdp-endpoint }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_DIR: ${{ inputs.working-directory }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_BASE_SHA: ${{ steps.mode.outputs.base_sha }}
        PROOFED_HEAD_REF: ${{ steps.mode.outputs.head_ref }}
        PROOFED_BASE_REF: ${{ steps.mode.outputs.base_ref }}
        PROOFED_PROVIDER: ${{ steps.mode.outputs.provider }}
        PROOFED_MODEL: ${{ steps.mode.outputs.model }}
        PROOFED_EFFORT: ${{ steps.mode.outputs.effort }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
        PROOFED_CODEX_HOME: ${{ steps.codex-auth.outputs.dir }}
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFED_SERVER: ${{ inputs.proofed-url }}
      run: |
        if [ -n "$PROOFED_CODEX_HOME" ]; then
          export CODEX_HOME="$PROOFED_CODEX_HOME"
          unset CODEX_API_KEY
        fi
        node "$GITHUB_ACTION_PATH/src/fix.ts"

    - name: Keep the recordings
      if: always() && steps.mode.outputs.mode != 'none'
      uses: actions/upload-artifact@v4
      with:
        name: proofed-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/proofed/**/clip.mp4
          ${{ runner.temp }}/proofed/**/crash-*.jpg
          ${{ runner.temp }}/proofed/**/*.ndjson*
          ${{ runner.temp }}/proofed/**/metadata.json
          ${{ runner.temp }}/proofed/*.json
          ${{ runner.temp }}/proofed/*.md
        if-no-files-found: ignore

    - name: Remove Codex subscription credentials
      if: always() && steps.codex-auth.outputs.dir != ''
      shell: bash
      env:
        PROOFED_CODEX_HOME: ${{ steps.codex-auth.outputs.dir }}
      run: rm -rf -- "$PROOFED_CODEX_HOME"
