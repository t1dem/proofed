name: Proofed fix
description: When the fix checkbox is ticked in the Proofed comment, the selected agent fixes the broken scenario and Kane checks the fix in Chrome before it is pushed.

inputs:
  url:
    description: Where the app runs once served, e.g. http://localhost:4173
    required: true
  install:
    description: Command that installs dependencies (runs once)
    required: true
  build:
    description: Command that builds the app (runs after every fix attempt)
    required: true
  serve:
    description: Command that serves the built app on `url` (Proofed starts and stops it)
    required: true
  lt-username:
    required: true
  lt-access-key:
    required: true
  claude-code-oauth-token:
    description: From `claude setup-token`
    default: ""
  codex-api-key:
    description: OpenAI API key for Codex (secrets.CODEX_API_KEY)
    default: ""
  provider:
    description: Fixer provider (claude or codex); inferred from model when empty
    default: ""
  model:
    description: Model the fixer uses
    default: ""
  effort:
    description: Reasoning effort supported by the selected model
    default: xhigh
  scenarios:
    default: .proofed/scenarios
  github-token:
    default: ${{ github.token }}
  kane-version:
    default: "0.10.4"

runs:
  using: composite
  steps:
    - name: Find the pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
          --jq '"base=\(.base.sha)\nbase_ref=\(.base.ref)\nhead_ref=\(.head.ref)"' >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.head_ref }}
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        # The agent can read the checkout. src/push.ts passes the token to git push itself.
        persist-credentials: false

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Kane CLI, fixer and ffmpeg
      shell: bash
      env:
        PROOFED_PROVIDER: ${{ inputs.provider }}
        PROOFED_MODEL: ${{ inputs.model }}
      run: |
        provider=$(node --input-type=module -e 'const { configuredFixer } = await import(`${process.env.GITHUB_ACTION_PATH}/../src/agent.ts`); console.log(configuredFixer().provider);')
        npm install -g "@testmuai/kane-cli@${{ inputs.kane-version }}" >/dev/null
        if [ "$provider" = codex ]; then npm install -g @openai/codex@0.169.0 >/dev/null; else npm install -g @anthropic-ai/claude-code >/dev/null; fi
        command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
        ${{ inputs.install }}

    - name: Log Kane in
      shell: bash
      env:
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
      # Logging in once sets up the TestMu project and folder before the parallel runs start;
      # otherwise the first runs race to create them and fail.
      run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" </dev/null

    - name: Fix, verify with Kane
      shell: bash
      env:
        PROOFED_URL: ${{ inputs.url }}
        PROOFED_BUILD: ${{ inputs.build }}
        PROOFED_SERVE: ${{ inputs.serve }}
        PROOFED_SCENARIOS: ${{ inputs.scenarios }}
        PROOFED_BASE_SHA: ${{ steps.pr.outputs.base }}
        PROOFED_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        PROOFED_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        PROOFED_OUT: ${{ runner.temp }}/proofed
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        CODEX_API_KEY: ${{ inputs.codex-api-key }}
        PROOFED_PROVIDER: ${{ inputs.provider }}
        PROOFED_MODEL: ${{ inputs.model }}
        PROOFED_EFFORT: ${{ inputs.effort }}
        KANE_CLI_CDP_TIMEOUT_MS: "60000"
        KANE_CLI_CDP_RETRIES: "2"
        KANE_CLI_USER_AGENT: github-action
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/../src/fix.ts"
