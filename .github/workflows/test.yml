name: Test CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is not verified yet (docs/cli.md): its suite needs work of its own before it can gate a PR.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The suite also covers the site's worker, which has its own dependencies.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: site
      - name: Install ffmpeg for recording tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
              macOS) brew install ffmpeg ;;
            esac
          fi
          ffmpeg -version
      - name: Require browser test prerequisites
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { findChrome } from './src/targets/chrome.ts';
          import { findOnPath } from './src/which.ts';
          assert.ok(findChrome(), 'Chrome must be available; do not skip the browser tests');
          assert.ok(findOnPath('ffmpeg'), 'ffmpeg must be available for recordings');
          NODE
      - run: npm run typecheck
      # All Kane invocations in the suite use src/testing/fake-kane.ts or a fixture.
      # No Kane installation, login or paid scenarios are needed.
      # macOS runners have 3 cores: test files running side by side starve each other's Chrome.
      - run: npm test -- ${{ runner.os == 'macOS' && '--test-concurrency=1' || '' }}
      - name: Compile and smoke-test the installed entry
        run: |
          pnpm exec tsc -p tsconfig.build.json
          node dist/proofed.js --version
          node bin/proofed.cjs --help
