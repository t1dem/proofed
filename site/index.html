<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Proofed — every pull request, run in Chrome</title>
    <meta name="description" content="For web apps, Proofed runs the user flows a pull request touches in Chrome, posts the recording on the PR, and lets Claude or Codex fix what broke." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable as an app (Add to Home Screen): it opens on /app, full screen, with its own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Proofed" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Self-hosted, same slicing as Google Fonts' css2 (unicode-range kept), so text renders the same without a render-blocking third-party request. Newsreader and IBM Plex Sans were never painted — nothing uses their faces. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link href="/fonts/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
